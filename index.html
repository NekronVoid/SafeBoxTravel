<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IoT Bidireccional</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .contenedor-metricas { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .tarjeta { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 30%; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; }
        .btn-on { background-color: #28a745; }
        .btn-off { background-color: #dc3545; }
        #grafica-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 80%; margin: 0 auto; }
    </style>
</head>
<body>

    <h1>Panel de Telemetría IoT</h1>

    <div class="contenedor-metricas">
        <div class="tarjeta">
            <h2>Latencia End-to-End</h2>
            <h1 id="latencia-texto">0 ms</h1>
        </div>
        <div class="tarjeta">
            <h2>Pérdida de Paquetes</h2>
            <h1 id="perdida-texto">0.00 %</h1>
        </div>
        <div class="tarjeta">
            <h2>Control de Actuador</h2>
            <button class="btn btn-on" onclick="enviarComando('ON')">Encender LED</button>
            <button class="btn btn-off" onclick="enviarComando('OFF')">Apagar LED</button>
        </div>
    </div>

    <div id="grafica-container">
        <canvas id="graficaSensores"></canvas>
    </div>

    <script>
        // Configuración de Chart.js
        const ctx = document.getElementById('graficaSensores').getContext('2d');
        const grafica = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Valor del Potenciómetro',
                    data: [],
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.3,
                    fill: false
                }]
            },
            options: { animation: false }
        });

        // Variables para cálculo de pérdida
        let mensajesRecibidos = 0;
        let secuenciaMinima = -1;
        let secuenciaMaxima = -1;

        // Conexión WebSocket al servidor FastAPI
        const ws = new WebSocket("ws://localhost:8000/ws/telemetria");

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // 1. Actualizar Latencia
            document.getElementById('latencia-texto').innerText = data.latencia_ms + " ms";

            // 2. Calcular y actualizar Pérdida de Paquetes
            mensajesRecibidos++;
            let seq = data.sequence_id;
            
            if (secuenciaMinima === -1 || seq < secuenciaMinima) secuenciaMinima = seq;
            if (seq > secuenciaMaxima) secuenciaMaxima = seq;
            
            let rango = secuenciaMaxima - secuenciaMinima + 1;
            let porcentajePerdida = 0;
            if (rango > 0) {
                porcentajePerdida = (1 - (mensajesRecibidos / rango)) * 100;
            }
            
            // Evitamos números negativos por desincronización de inicio
            if (porcentajePerdida < 0) porcentajePerdida = 0; 
            document.getElementById('perdida-texto').innerText = porcentajePerdida.toFixed(2) + " %";

            // 3. Actualizar Gráfica (manteniendo solo los últimos 20 puntos)
            if (grafica.data.labels.length > 20) {
                grafica.data.labels.shift();
                grafica.data.datasets[0].data.shift();
            }
            grafica.data.labels.push(new Date().toLocaleTimeString());
            grafica.data.datasets[0].data.push(data.sensor_value);
            grafica.update();
        };

        // Función para mandar el JSON de control por WebSocket
        function enviarComando(estado) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(estado);
            } else {
                alert("El servidor no está conectado.");
            }
        }
    </script>
</body>
</html>
