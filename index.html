<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IoT - Cadena de Custodia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6 relative">

    <!-- Indicador de conexion WebSocket -->
    <div id="estado-conexion" class="absolute top-6 right-6 px-4 py-2 rounded-full font-bold text-sm bg-red-500 text-white shadow transition-colors">
        Desconectado
    </div>

    <div class="max-w-7xl mx-auto mt-10">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-900">Panel de Telemetría IoT - ML Integrado</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-md p-6 text-center border-t-4 border-blue-500">
                <h2 class="text-lg font-semibold text-gray-600">Latencia E2E</h2>
                <p id="latencia-texto" class="text-4xl font-bold text-blue-600 mt-2">0 ms</p>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6 text-center border-t-4 border-purple-500">
                <h2 class="text-lg font-semibold text-gray-600">Pérdida de Paquetes</h2>
                <p id="perdida-texto" class="text-4xl font-bold text-purple-600 mt-2">0.00 %</p>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6 text-center border-t-4 border-gray-800">
                <h2 class="text-lg font-semibold text-gray-600">Diagnóstico IA (Random Forest)</h2>
                <div id="badge-estado" class="mt-4 inline-block px-6 py-2 rounded-full text-white font-bold text-lg bg-gray-400 transition-colors duration-300">
                    Esperando datos...
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6 mb-8 w-full max-w-5xl mx-auto">
            <h2 class="text-xl font-bold text-gray-700 mb-4 text-center">Monitoreo Multivariable en Vivo</h2>
            <canvas id="graficaSensores" height="100"></canvas>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6 text-center max-w-2xl mx-auto">
            <h2 class="text-xl font-bold text-gray-700 mb-4">Control Bidireccional de Actuadores</h2>
            <button onclick="enviarComando('ON')" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded shadow-lg mx-2 transition">
                Encender Ventilación
            </button>
            <button onclick="enviarComando('OFF')" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded shadow-lg mx-2 transition">
                Apagar Sistema
            </button>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('graficaSensores').getContext('2d');
        const grafica = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Temperatura (°C)', data: [], borderColor: 'rgb(239, 68, 68)', tension: 0.3, borderWidth: 2 },
                    { label: 'Humedad (%)', data: [], borderColor: 'rgb(59, 130, 246)', tension: 0.3, borderWidth: 2 },
                    { label: 'Impacto (G)', data: [], borderColor: 'rgb(16, 185, 129)', tension: 0.3, borderWidth: 2 }
                ]
            },
            options: { animation: false, scales: { y: { beginAtZero: true } } }
        });

        let mensajesRecibidos = 0;
        let secuenciaMinima = -1;
        let secuenciaMaxima = -1;

        const ws = new WebSocket("ws://localhost:8000/ws/telemetria");

        ws.onopen = function() {
            const indicador = document.getElementById('estado-conexion');
            indicador.innerText = "Conectado al Servidor";
            indicador.classList.remove('bg-red-500');
            indicador.classList.add('bg-green-500');
        };

        ws.onclose = function() {
            const indicador = document.getElementById('estado-conexion');
            indicador.innerText = "Desconectado";
            indicador.classList.remove('bg-green-500');
            indicador.classList.add('bg-red-500');
        };

        ws.onmessage = function(event) {
            const payload = JSON.parse(event.data);
            
            document.getElementById('latencia-texto').innerText = payload.latencia_ms + " ms";

            mensajesRecibidos++;
            let seq = payload.sequence_id;
            
            if (secuenciaMinima === -1 || seq < secuenciaMinima) secuenciaMinima = seq;
            if (seq > secuenciaMaxima) secuenciaMaxima = seq;
            
            let rango = secuenciaMaxima - secuenciaMinima + 1;
            let porcentajePerdida = rango > 0 ? (1 - (mensajesRecibidos / rango)) * 100 : 0;
            if (porcentajePerdida < 0) porcentajePerdida = 0; 
            document.getElementById('perdida-texto').innerText = porcentajePerdida.toFixed(2) + " %";

            const estado = payload.estado_clasificado;
            const badge = document.getElementById('badge-estado');
            badge.innerText = estado;
            
            if (estado === "Tránsito Seguro") {
                badge.className = "mt-4 inline-block px-6 py-2 rounded-full text-white font-bold text-lg bg-green-500";
            } else if (estado === "Manejo Brusco (Caída)") {
                badge.className = "mt-4 inline-block px-6 py-2 rounded-full text-white font-bold text-lg bg-yellow-500";
            } else {
                badge.className = "mt-4 inline-block px-6 py-2 rounded-full text-white font-bold text-lg bg-red-600 shadow-[0_0_15px_rgba(220,38,38,0.7)] animate-pulse";
            }

            if (grafica.data.labels.length > 25) {
                grafica.data.labels.shift();
                grafica.data.datasets[0].data.shift();
                grafica.data.datasets[1].data.shift();
                grafica.data.datasets[2].data.shift();
            }
            
            grafica.data.labels.push(new Date().toLocaleTimeString());
            grafica.data.datasets[0].data.push(payload.data.temperatura_c);
            grafica.data.datasets[1].data.push(payload.data.humedad_pct);
            grafica.data.datasets[2].data.push(payload.data.impacto_g);
            grafica.update();
        };

        function enviarComando(estado) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(estado);
            } else {
                alert("Sin conexión al backend.");
            }
        }
    </script>
</body>
</html>
